org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# The version. Named `version` rather than `proba.version` since the build went onto the shared
# conventions: it is the PROJECT's version, which is what the archive tasks read for their file names.
version=0.1.0

# WHAT THE SHARED CONVENTIONS READ (`ru.workinprogress.sborka`).
sborka.group=dev.youndie.proba
sborka.repository=youndie/proba
sborka.description=What a consumer of your library actually gets, read from the published artefacts.
sborka.inceptionYear=2026

# 21 for both, which is what every module is compiled to. It was 25 and not by choice: kompot
# published class file version 69 and said so nowhere — reported by this repository's own check,
# fixed upstream, and carrying the constraint forward would only impose proba's floor on whoever
# uses the action.
sborka.jvmToolchain=21
sborka.jvmFloor=21

# OFF, and not as a debt. `explicitApi()` asks every public declaration to spell out its visibility
# and return type for a consumer compiling against the artefact; nothing here is published — the
# deliverable is a GitHub Action and a server image — and the four modules are libraries of this
# build alone.
sborka.explicitApi=false
