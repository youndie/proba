packages:
  - "packages/*"

# esbuild and sharp fetch or build a platform binary in a postinstall script, and pnpm refuses to
# skip such scripts silently — it fails the install instead, which is the right default. Naming them
# is the answer; the alternative is an install that quietly produces a tree missing its binaries.
# pnpm 11 removed `onlyBuiltDependencies` for this map: under pnpm 12 the old list was not read, and
# the install failed with ERR_PNPM_IGNORED_BUILDS for exactly these two.
allowBuilds:
  esbuild: true
  sharp: true
