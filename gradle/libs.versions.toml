[versions]
# The shared build conventions: the coordinate, the version, the toolchain, the style and the test
# platform. Bumping this changes how every module is built.
sborka = "0.1.0.20"
kotlin = "2.4.10"
ktor = "3.4.0"
serialization = "1.11.0"
coroutines = "1.11.0"

kompot = "0.36.2.125"

[libraries]
kompot-bom = { module = "io.github.youndie:kompot-bom", version.ref = "kompot" }
kompot-core = { module = "io.github.youndie:kompot-core" }
kompot-standard = { module = "io.github.youndie:kompot-standard" }
kompot-ktor = { module = "io.github.youndie:kompot-ktor" }
kompot-forms = { module = "io.github.youndie:kompot-forms" }
form-core = { module = "io.github.youndie:form-core" }
kompot-realtime = { module = "io.github.youndie:kompot-realtime" }
kompot-realtime-server = { module = "io.github.youndie:kompot-realtime-server" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
asm = { module = "org.ow2.asm:asm", version = "9.9" }
asm-tree = { module = "org.ow2.asm:asm-tree", version = "9.9" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sborkaJvm = { id = "ru.workinprogress.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "ru.workinprogress.sborka.lint", version.ref = "sborka" }
