name: proba
description: Check what a consumer actually gets when they add your published library
author: youndie

branding:
  icon: package
  color: red

inputs:
  coordinate:
    description: "group:artifact:version — one per line for several"
    required: true
  repository:
    description: Base URL of the repository to read. Defaults to Maven Central.
    required: false
    default: https://repo1.maven.org/maven2
  deep:
    description: >
      Run a real consumer build to confirm what the metadata only suspects. Slower, and the only way
      to tell a correct `implementation` from a defect.
    required: false
    default: "true"
  fail-on:
    description: defect | suspicion | none
    required: false
    default: defect
  badge-dir:
    description: >
      Where to write an SVG badge per coordinate, named `<group>.<artifact>.svg`. Left empty, none is
      written. A publication never changes, so a badge changes when a version is released and not
      when somebody looks at one — which is why this is a file a build produces rather than a service
      a README calls.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # 21, deliberately low: a composite action that pins a newer JDK imposes its own floor on every
    # repository that uses it. See docs/research/architecture.md §1.11 for the constraint this used
    # to carry and how it went away.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - uses: gradle/actions/setup-gradle@v4
      with:
        build-root-directory: ${{ github.action_path }}

    - shell: bash
      env:
        PROBA_COORDINATES: ${{ inputs.coordinate }}
        PROBA_REPOSITORY: ${{ inputs.repository }}
        PROBA_DEEP: ${{ inputs.deep }}
        PROBA_FAIL_ON: ${{ inputs.fail-on }}
        PROBA_BADGE_DIR: ${{ inputs.badge-dir }}
      run: ${{ github.action_path }}/scripts/run-action.sh
