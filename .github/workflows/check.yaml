name: check

# On both, deliberately. A check that runs only on main is discovered broken long after the change
# that broke it; one that runs only on pull requests lets main rot while every branch is green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 25, because kompot's published classes are class file 69 and nothing older can load them.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kompot-web test
      - run: pnpm --filter kompot-web typecheck
      # The generated types and the corpus must still be what the pinned kompot version produces.
      # Without this they are a copy, and a copy nobody regenerates stops being true quietly.
      - run: pnpm --filter kompot-web schema:check
      - run: pnpm --filter kompot-web corpus:check
      # Boxes, not styles. The runner has Chrome, so this costs no download.
      - run: ./scripts/gate-layout.sh

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Both stand on a library published with a defect on purpose, so a green run here means the
      # checks discriminated rather than stayed quiet.
      # Cheap and first: a manifest that does not parse breaks every consumer of the action before
      # anything else in this job has a chance to say so.
      - run: python3 ./scripts/check-action-manifest.py
      - run: ./scripts/gate.sh
      - run: ./scripts/gate-action.sh
      # Live coordinates, nothing assembled: the rule has to discriminate between a publication that
      # excludes consumers and two that do not while all three omit the same metadata.
      - run: ./scripts/gate-jvm-version.sh
